<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://i.ibb.co/LjbcMss/Untitled-design-1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hasnain Zaidi</title>
    <style id="hide-nl-badge-css">.nl-badge,#nl-badge,.nl-card,#nl-card{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}</style>
    <script>
      (function () {
        var SEL = '.nl-badge, #nl-badge, .nl-card, #nl-card';
        function sweep(root) {
          if (!root || !root.querySelectorAll) return;
          root.querySelectorAll(SEL).forEach(function (el) { el.remove(); });
          root.querySelectorAll('*').forEach(function (el) { if (el.shadowRoot) sweep(el.shadowRoot); });
        }
        function run() { sweep(document); }
        new MutationObserver(run).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('DOMContentLoaded', run);
        window.addEventListener('load', run);
        var n = 0, t = setInterval(function () { run(); if (++n > 66) clearInterval(t); }, 300);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
