    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
    <style id="hide-nl-badge-css">.nl-badge,#nl-badge,.nl-card,#nl-card,[aria-label^="Powered by Netlify" i]{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}</style>
    <script>
      (function () {
        var SEL = '.nl-badge, #nl-badge, .nl-card, #nl-card, [aria-label^="Powered by Netlify" i]';
        function sweep(root) {
          if (!root || !root.querySelectorAll) return;
          root.querySelectorAll(SEL).forEach(function (el) { el.remove(); });
          root.querySelectorAll('*').forEach(function (el) { if (el.shadowRoot) sweep(el.shadowRoot); });
        }
        function run() { sweep(document); }
        new MutationObserver(run).observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('DOMContentLoaded', run);
        window.addEventListener('load', run);
        var n = 0, t = setInterval(function () { run(); if (++n > 66) clearInterval(t); }, 300);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
